<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go Stone!!! - תפריט</title>
  <link rel="icon" href="../images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <div id="navRoot"></div>

  <main class="page">
     <img class="logo-hero" src="../images/logo.png" alt="Go Stone" width="260" height="260">
    <h1 class="greeting" id="greeting">שלום</h1>
    <p class="sub">מה נשחק היום?</p>

    <h2 class="section-title">בחירת רמה</h2>
    <div class="levels" id="levelCards">
      <button type="button" class="level-card" data-level="fast" aria-pressed="false">
        <span class="level-name">מהיר</span>
        <span class="level-time">15 שניות</span>
        <span class="level-desc">להכנסת שלוש הצורות. לשחקנים מהירים.</span>
      </button>
      <button type="button" class="level-card selected" data-level="medium" aria-pressed="true">
        <span class="level-name">בינוני</span>
        <span class="level-time">30 שניות</span>
        <span class="level-desc">להכנסת שלוש הצורות. קצב מאוזן.</span>
      </button>
      <button type="button" class="level-card" data-level="slow" aria-pressed="false">
        <span class="level-name">איטי</span>
        <span class="level-time">דקה</span>
        <span class="level-desc">להכנסת שלוש הצורות. קצב רגוע.</span>
      </button>
    </div>

    <div class="actions">
      <button type="button" class="btn primary large" id="startBtn">התחלת משחק</button>
    </div>

    <div class="chips">
      <a class="chip" href="instructions.html">איך משחקים?</a>
      <a class="chip" href="leaderboard.html">טבלת שיאים</a>
    </div>
  </main>

  <script src="../scripts/storage.js"></script>
  <script src="../scripts/nav.js"></script>
  <script src="../scripts/menu.js"></script>

</footer>
</body>
</html>
